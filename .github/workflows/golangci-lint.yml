name: Go checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - run: go run github.com/google/go-licenses@v1.6.0 check ./... --disallowed_types=forbidden,restricted
